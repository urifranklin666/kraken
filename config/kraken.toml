# KRAKEN configuration — /etc/kraken/kraken.toml
# Authorized laboratory use only.

[general]
hostname = "kraken"
data_dir = "/var/lib/kraken"
run_dir = "/run/kraken"
log_dir = "/var/log/kraken"
token_file = "/etc/kraken/api.token"
cert_file = "/etc/kraken/tls/cert.pem"
key_file = "/etc/kraken/tls/key.pem"
assets_dir = "/opt/kraken/app/kraken/assets"
http_port = 8080
https_port = 8443
bind = "0.0.0.0"
default_mode = "hybrid"
open_read = false

[radio]
# wlan1 is the RT5370 USB radio: 2.4 GHz monitor + injection.
# wlan0 is the onboard BCM43455: 5 GHz AP, no monitor mode.
monitor_iface = "wlan1"
ap_iface = "wlan0"
uplink_iface = "auto"
reg_domain = "US"
restore_networkmanager = true

[recon]
channels = [1, 6, 11, 1, 6, 11, 2, 7, 3, 8, 4, 9, 5, 10, 12, 13]
hop_interval = 1.2
adaptive_hop = true
# Aggressive deauth only ever targets BSSIDs listed in whitelist, and only
# when the daemon runs with --authorized.
aggressive = false
deauth_burst = 2
deauth_cooldown = 10.0
max_capture_mb = 4096
max_capture_files = 120
max_total_mb = 20480
handshake_cooldown = 30.0
whitelist = []
blacklist = []
verify_with_hcxtools = true

[ap]
ssid = "KRAKEN//LAB"
# Change this before first boot. Empty string = open network.
passphrase = "krakenlab"
channel = 36
band = "5"
portal = true
dns_hijack = true
client_isolation = true
fallback_2g = true
subnet = "10.13.37.1/24"
dhcp_start = "10.13.37.100"
dhcp_end = "10.13.37.200"
lease_time = "12h"
country = "US"
max_clients = 32
upstream_dns = "1.1.1.1"

[mitm]
# Requires: kraken daemon --authorized
allow = true
auto_start = false
