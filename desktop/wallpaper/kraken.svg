<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="KRAKEN Tokyo Night synthwave wallpaper">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101014"/>
      <stop offset="0.38" stop-color="#16161e"/>
      <stop offset="0.72" stop-color="#1a1b26"/>
      <stop offset="0.88" stop-color="#241b30"/>
      <stop offset="1" stop-color="#16161e"/>
    </linearGradient>

    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7768e" stop-opacity="0.92"/>
      <stop offset="0.42" stop-color="#bb9af7" stop-opacity="0.62"/>
      <stop offset="0.78" stop-color="#7aa2f7" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dcfff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#7dcfff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#bb9af7" stop-opacity="0.85"/>
      <stop offset="0.8" stop-color="#7dcfff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7dcfff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.78">
      <stop offset="0.45" stop-color="#101014" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#101014" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#101014" stop-opacity="0.86"/>
    </radialGradient>

    <pattern id="stars" width="180" height="180" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="26" r="1.1" fill="#c0caf5" opacity="0.55"/>
      <circle cx="76" cy="12" r="0.8" fill="#7dcfff" opacity="0.5"/>
      <circle cx="128" cy="48" r="1.4" fill="#c0caf5" opacity="0.35"/>
      <circle cx="40" cy="92" r="0.7" fill="#bb9af7" opacity="0.6"/>
      <circle cx="150" cy="118" r="1.0" fill="#c0cef5" opacity="0.4"/>
      <circle cx="98" cy="150" r="0.9" fill="#7aa2f7" opacity="0.45"/>
      <circle cx="170" cy="8" r="0.6" fill="#c0caf5" opacity="0.5"/>
      <circle cx="58" cy="164" r="1.2" fill="#7dcfff" opacity="0.3"/>
    </pattern>

    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" opacity="0.018"/>
    </pattern>

    <clipPath id="sunclip">
      <circle cx="800" cy="462" r="188"/>
    </clipPath>

    <clipPath id="floor">
      <rect x="0" y="560" width="1600" height="340"/>
    </clipPath>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="565" fill="url(#stars)"/>

  <circle cx="800" cy="462" r="360" fill="url(#sun)" opacity="0.5"/>
  <circle cx="800" cy="462" r="236" fill="url(#sun)" opacity="0.55" filter="url(#soft)"/>

