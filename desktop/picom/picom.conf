# KRAKEN picom — rounded, glowing, lightly blurred Tokyo Night
# The Pi 4 vc4 driver exposes a DRI2 GLX provider that picom's glx backend
# cannot get a usable fbconfig from (GLX_BAD_FB_CONFIG -> "Couldn't find current
# GLX or EGL context" -> abort at login). xrender is the stable backend here:
# shadows, corner radius, fading and box blur all work, and picom stays up.

backend = "xrender";
vsync = false;
use-damage = true;
xrender-sync-fence = true;

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.42;
shadow-offset-x = -9;
shadow-offset-y = -9;
shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Dunst'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'"
];

corner-radius = 10;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# picom 12 dropped dual_kawase; box blur is the cheap option that still works
# on xrender.
blur-method = "box";
blur-size = 10;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Dunst'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_NET_WM_WINDOW_TYPE@:32a *= '_NET_WM_WINDOW_TYPE_DOCK'"
];

fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 12;
no-fading-openclose = false;

active-opacity = 1.0;
inactive-opacity = 0.96;
frame-opacity = 1.0;
focus-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'Dunst'"
];

opacity-rule = [
  "94:class_g = 'Alacritty'",
  "100:class_g = 'Chromium'",
  "100:class_g = 'Kraken'",
  "92:class_g = 'Rofi'"
];

mark-wmwin-focused = true;
mark-ovredir-focused = true;
