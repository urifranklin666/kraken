; KRAKEN polybar — Tokyo Night neon
; Live values come from /run/kraken via polybar-kraken-* scripts.

[colors]
background = #16161e
background-alt = #1a1b26
foreground = #c0caf5
foreground-dim = #a9b1d6
muted = #565f89
cyan = #7dcfff
blue = #7aa2f7
magenta = #bb9af7
green = #9ece6a
yellow = #e0af68
red = #f7768e
line = #2f3549

[bar/kraken]
monitor = ${env:MONITOR:}
width = 100%
height = 36
offset-x = 0
offset-y = 0
radius = 0
fixed-center = true
dpi = 96
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
line-color = ${colors.line}
border-size = 0
padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 2
font-0 = JetBrainsMono Nerd Font:size=10.5;3
font-1 = JetBrainsMono Nerd Font:style=Bold:size=10.5;3
font-2 = JetBrains Mono:size=10.5;3
font-3 = monospace:size=10;3
modules-left = i3 custom/kraken
modules-center = custom/status custom/stats
modules-right = cpu memory temperature custom/uplink pulseaudio date tray
override-redirect = false
enable-ipc = true
scroll-up = i3wm-wsnext
scroll-down = i3wm-wsprev
cursor-click = pointer
cursor-scroll = ns-resize
separator = ""

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
strip-wsnumbers = false
label-mode-padding = 4
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.magenta}
label-focused = %name%
label-focused-background = ${colors.blue}
label-focused-foreground = ${colors.background}
label-focused-underline = ${colors.cyan}
label-focused-padding = 7
label-unfocused = %name%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 7
label-visible = %name%
label-visible-foreground = ${colors.foreground-dim}
label-visible-padding = 7
label-urgent = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 7
label-separator = " "

[module/custom/kraken]
type = custom/script
exec = polybar-kraken
interval = 2
format = <label>
format-prefix = "◈ "
format-prefix-foreground = ${colors.magenta}
label = %output%
label-foreground = ${colors.foreground}
click-left = kraken-menu
click-right = kraken-dashboard

[module/custom/status]
type = custom/script
exec = polybar-kraken-status
interval = 2
format = <label>
label = %output%
label-foreground = ${colors.muted}

[module/custom/stats]
type = custom/script
exec = polybar-kraken-stats
interval = 2
format = <label>
label = %output%
click-left = kraken-dashboard
click-right = kraken-web

[module/custom/uplink]
type = custom/script
exec = polybar-net
interval = 5
format = <label>
label = %output%
label-foreground = ${colors.foreground-dim}
click-left = kraken-menu

[module/cpu]
type = internal/cpu
interval = 3
format = <label>
format-prefix = "cpu "
format-prefix-foreground = ${colors.blue}
label = %percentage:2%%
label-foreground = ${colors.foreground-dim}

[module/memory]
type = internal/memory
interval = 5
format = <label>
format-prefix = "mem "
format-prefix-foreground = ${colors.magenta}
label = %percentage_used:2%%
label-foreground = ${colors.foreground-dim}

[module/temperature]
type = internal/temperature
thermal-zone = 0
interval = 5
warn-temperature = 68
units = true
format = <ramp> <label>
label = %temperature-c%
label-foreground = ${colors.foreground-dim}
ramp-0 = ▁
ramp-1 = ▃
ramp-2 = █
ramp-foreground = ${colors.cyan}
format-warn = <ramp> <label-warn>
label-warn = %temperature-c%
label-warn-foreground = ${colors.red}

[module/fs]
type = internal/fs
interval = 10
mount-0 = /
format-mounted = <label-mounted>
format-prefix = "ssd "
format-prefix-foreground = ${colors.green}
label-mounted = %percentage_used:2%%
label-mounted-foreground = ${colors.foreground-dim}

[module/pulseaudio]
type = internal/pulseaudio
interval = 1
format-volume = <ramp-volume> <label-volume>
format-muted = <label-muted>
ramp-volume-0 = ▁
ramp-volume-1 = ▄
ramp-volume-2 = █
ramp-volume-foreground = ${colors.cyan}
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground-dim}
label-muted = "vol mute"
label-muted-foreground = ${colors.red}
click-right = kraken-volume mute
scroll-up = kraken-volume up
scroll-down = kraken-volume down

[module/date]
type = internal/date
interval = 20
date = "%a %d %b"
time = "%H:%M"
format = <label>
label = %date%  %time%
label-foreground = ${colors.cyan}
click-left = kraken-menu

[module/tray]
type = internal/tray
tray-position = right
tray-padding = 2
tray-maxsize = 18
format-margin = 6
tray-spacing = 8
tray-background = ${colors.background}

[settings]
screenchange-reload = true
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over
pseudo-transparency = false
